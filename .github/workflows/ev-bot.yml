name: Ev ilanı kontrol

on:
  schedule:
    - cron: "*/20 * * * *"   # her 20 dakikada bir (GitHub bazen birkaç dk geciktirir)
  push:
    branches: [main]
    paths: ["bot.py", "config.yaml", ".github/workflows/**"]
  workflow_dispatch:          # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write             # görülen ilan listesini (seen.json) kaydetmek için

concurrency:
  group: ev-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: İlanları kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITES: emlakjet   # sahibinden/hepsiemlak GitHub sunucularını engelliyor; Mac'te çalıştırılabilir
          BROWSER_SITES: sahibinden
        run: xvfb-run -a python bot.py
      - name: Görülen ilanları kaydet
        run: |
          git config user.name "ev-bot"
          git config user.email "ev-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen güncellendi [skip ci]" && git push)
